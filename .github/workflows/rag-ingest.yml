name: 🧠 RAG — Ingest Guidelines into Supabase (via VPS SSH)

# ═══════════════════════════════════════════════════════════════════════════
# Manual trigger only — never runs automatically.
# Use the "Run workflow" button in GitHub UI: Actions tab.
#
# This workflow REUSES the existing VPS deployment (same SSH secrets as
# deploy.prod.yml) — the VPS already has .env.local with:
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#   - OPENAI_API_KEY
#
# So no need to duplicate credentials in GitHub! It uses your existing
# SSH secrets:
#   - SSH_HOST (already set, used by deploy.prod.yml)
#   - SSH_USER (already set)
#   - SSH_PRIVATE_KEY (already set)
#   - SSH_PORT (optional, defaults to 22)
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        required: true
        default: 'dry-run'
        options:
          - dry-run             # Just verify VPS env + count files
          - migrate-only        # Apply Supabase migrations
          - single-source       # Ingest ONE source (specify below)
          - full-ingest         # Full pipeline: migrate + ingest 984 docs
          - embed-only          # Generate missing embeddings on existing chunks (via VPS — needs VPS up)
          - embed-runner        # Same as embed-only but runs on the GitHub-hosted Ubuntu runner (bypasses VPS entirely)
      source:
        description: 'Source code (only for single-source mode, e.g. NICE, GOLD, WHO)'
        type: string
        required: false
        default: ''
      branch:
        description: 'Git branch to use on VPS (default: this branch)'
        type: string
        required: false
        default: 'claude/switch-deepseek-llm-u2T74'
      resume:
        description: 'Resume mode (skip already-ingested docs by SHA-256)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: rag-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest-via-vps:
    name: 'Ingest via VPS SSH (mode=${{ inputs.mode }})'
    runs-on: ubuntu-latest
    # 120 min — embed-only mode generates ~56k OpenAI embeddings sequentially
    # at ~600-800 chunks/min, so total runtime is typically 60-90 min. Other
    # modes finish in 5-15 min and are unaffected by the higher cap.
    timeout-minutes: 120

    steps:
      # ─────────────────────────────────────────────────────────────────
      # VPS path (dry-run, migrate-only, single-source, full-ingest,
      # embed-only). Skipped when mode = embed-runner.
      # ─────────────────────────────────────────────────────────────────
      - name: Verify SSH secrets
        if: inputs.mode != 'embed-runner'
        env:
          HAS_SSH_HOST: ${{ secrets.SSH_HOST != '' }}
          HAS_SSH_USER: ${{ secrets.SSH_USER != '' }}
          HAS_SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY != '' }}
        run: |
          missing=0
          [ "$HAS_SSH_HOST" = "true" ] || { echo "::error::SSH_HOST missing"; missing=1; }
          [ "$HAS_SSH_USER" = "true" ] || { echo "::error::SSH_USER missing"; missing=1; }
          [ "$HAS_SSH_KEY"  = "true" ] || { echo "::error::SSH_PRIVATE_KEY missing"; missing=1; }
          if [ $missing -eq 1 ]; then
            echo ""
            echo "These secrets should already be configured (used by deploy.prod.yml)."
            echo "Configure at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ SSH secrets present (reusing deploy.prod.yml setup)"

      - name: Run RAG operation on VPS via SSH
        if: inputs.mode != 'embed-runner'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MODE: ${{ inputs.mode }}
          SOURCE: ${{ inputs.source }}
          BRANCH: ${{ inputs.branch }}
          RESUME: ${{ inputs.resume }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: MODE,SOURCE,BRANCH,RESUME
          # 110m — leaves a small buffer below the job timeout (120m) so the
          # SSH layer surfaces a clean error if the embed-only run overruns
          # rather than the runner killing everything mid-write.
          command_timeout: 110m
          script: |
            set -e
            echo "═══════════════════════════════════════════════════════════"
            echo "🧠 AI-DOCTOR RAG Operation"
            echo "═══════════════════════════════════════════════════════════"
            echo "  Mode    : $MODE"
            echo "  Source  : ${SOURCE:-(n/a)}"
            echo "  Branch  : $BRANCH"
            echo "  Resume  : $RESUME"
            echo ""

            # Activate Node env (same as deploy.prod.yml)
            source /home/tibok/nodevenv/medical-ai-expert/22/bin/activate
            cd /home/tibok/medical-ai-expert

            echo "Node version: $(node --version)"
            echo "NPM version : $(npm --version)"
            echo "Working dir : $(pwd)"
            echo ""

            # ─── Robust branch checkout ────────────────────────────────────
            echo "📥 Fetching all remote branches..."
            git fetch origin --prune
            echo ""

            echo "🔀 Switching to branch: $BRANCH"
            # Stash any local changes to .env.local etc. (preserve them)
            git stash push --include-untracked --message "rag-ingest-tmp" || true
            # Checkout target branch — handles both new local and existing local
            if git show-ref --verify --quiet refs/heads/$BRANCH; then
              echo "  Local branch exists, switching"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              echo "  Creating local tracking branch from origin/$BRANCH"
              git checkout -b "$BRANCH" "origin/$BRANCH"
            fi
            # Restore stashed .env.local etc.
            git stash pop 2>/dev/null || true
            echo "  Now on: $(git branch --show-current) at $(git rev-parse --short HEAD)"
            echo ""

            # ─── Verify the RAG code is present on this branch ─────────────
            if [ ! -d tibok-rag-collector/extracted ]; then
              echo "::error::RAG code not on branch '$BRANCH'!"
              echo "Expected directory: tibok-rag-collector/extracted/"
              echo "Available files:"
              ls -la
              exit 1
            fi
            n_files=$(ls tibok-rag-collector/extracted/*.json 2>/dev/null | grep -v _summary | wc -l)
            echo "✅ Found $n_files extracted source files on branch $BRANCH"
            echo ""

            # Verify .env.local exists with required vars
            if [ ! -f .env.local ]; then
              echo "::error::.env.local not found on VPS!"
              echo "Expected at: $(pwd)/.env.local"
              exit 1
            fi

            for var in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OPENAI_API_KEY; do
              if ! grep -q "^$var=" .env.local; then
                echo "::error::$var missing from .env.local"
                exit 1
              fi
            done
            echo "✅ .env.local has Supabase + OpenAI credentials"
            echo ""

            # Install dependencies if needed (tsx, @supabase/supabase-js, openai, etc.)
            if [ ! -d node_modules ] || [ ! -d node_modules/tsx ]; then
              echo "📦 Installing dependencies..."
              npm install
            fi

            # Source env vars from .env.local for the npm scripts
            set -a
            source .env.local
            set +a

            case "$MODE" in
              dry-run)
                echo "🟦 DRY RUN — listing what would be done"
                echo ""
                echo "Would apply migrations:"
                ls supabase/migrations/*.sql | sed 's|^|  - |'
                echo ""
                echo "Would ingest:"
                ls tibok-rag-collector/extracted/*.json | grep -v _summary | head -20
                echo "  ... ($n_files total)"
                ;;

              migrate-only)
                echo "🗄️  Applying Supabase migrations..."
                npm run rag:migrate
                ;;

              single-source)
                if [ -z "$SOURCE" ]; then
                  echo "::error::Mode 'single-source' requires the 'source' input"
                  exit 1
                fi
                if [ ! -f "tibok-rag-collector/extracted/$SOURCE.json" ]; then
                  echo "::error::No JSON file for source '$SOURCE'"
                  echo "Available sources:"
                  ls tibok-rag-collector/extracted/*.json | grep -v _summary | sed 's|.*/||;s|\.json||'
                  exit 1
                fi
                echo "🔬 Ingesting source: $SOURCE"
                RESUME=$RESUME npm run rag:ingest-extracted -- "$SOURCE"
                ;;

              full-ingest)
                echo "🚀 FULL INGESTION (~10-15 min, ~\$0.22 OpenAI cost)"
                echo "Step 1/2: applying migrations..."
                npm run rag:migrate
                echo ""
                echo "Step 2/2: ingesting all 984 guidelines..."
                RESUME=$RESUME npm run rag:ingest-extracted -- ALL
                ;;

              embed-only)
                # Populate the `embedding` column on every guidelines_chunks
                # row that currently has NULL. Targets the ~56k chunks that
                # were ingested but never embedded (cf scripts/rag-ingest/
                # generate-embeddings.mjs header for the audit context).
                # ~60-90 min runtime, ~\$0.34 OpenAI cost.
                echo "🧮 EMBED-ONLY — generating embeddings for chunks with NULL embedding"
                echo "Expected: ~56k chunks, ~60-90 min runtime, ~\$0.34 OpenAI cost."
                echo ""
                if [ ! -f scripts/rag-ingest/generate-embeddings.mjs ]; then
                  echo "::error::scripts/rag-ingest/generate-embeddings.mjs not found on branch '$BRANCH'."
                  echo "Make sure the branch you selected actually contains this script."
                  exit 1
                fi
                # The script reads OPENAI_API_KEY, SUPABASE_URL (or
                # NEXT_PUBLIC_SUPABASE_URL) and SUPABASE_SERVICE_ROLE_KEY from
                # the environment — already sourced from .env.local above.
                node scripts/rag-ingest/generate-embeddings.mjs
                ;;

              *)
                echo "::error::Unknown mode: $MODE"
                exit 1
                ;;
            esac

            echo ""
            echo "═══════════════════════════════════════════════════════════"
            echo "✅ Operation complete: $MODE"
            echo "═══════════════════════════════════════════════════════════"

      # ─────────────────────────────────────────────────────────────────
      # Runner-direct path (embed-runner only). Used when the VPS is
      # unreachable. Runs the embedding backfill script directly on the
      # GitHub-hosted Ubuntu runner, using GitHub secrets — no SSH, no
      # VPS, no .env.local. Required secrets:
      #   - OPENAI_API_KEY
      #   - SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL)
      #   - SUPABASE_SERVICE_ROLE_KEY
      # ─────────────────────────────────────────────────────────────────
      - name: '[embed-runner] Verify GitHub-secret credentials'
        if: inputs.mode == 'embed-runner'
        env:
          HAS_OPENAI: ${{ secrets.OPENAI_API_KEY != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' || secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          HAS_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          missing=0
          [ "$HAS_OPENAI" = "true" ] || { echo "::error::OPENAI_API_KEY secret missing"; missing=1; }
          [ "$HAS_SUPABASE_URL" = "true" ] || { echo "::error::SUPABASE_URL (or NEXT_PUBLIC_SUPABASE_URL) secret missing"; missing=1; }
          [ "$HAS_SERVICE_KEY" = "true" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY secret missing"; missing=1; }
          if [ $missing -eq 1 ]; then
            echo ""
            echo "Add the missing secrets at:"
            echo "https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All 3 required secrets present"

      - name: '[embed-runner] Checkout selected branch'
        if: inputs.mode == 'embed-runner'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: '[embed-runner] Setup Node 22'
        if: inputs.mode == 'embed-runner'
        # Node 22 — needed because @supabase/supabase-js v2.39+ pulls in
        # @supabase/realtime-js which requires a native WebSocket
        # constructor. Node 20 doesn't ship one (introduced in Node 21+),
        # so the SupabaseClient constructor throws at init even when we
        # never use realtime. Node 22 LTS has globalThis.WebSocket
        # natively.
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: '[embed-runner] Install minimal dependencies'
        if: inputs.mode == 'embed-runner'
        # Avoids the multi-minute Next.js npm install. We only need the two
        # packages the script imports. Approach: copy the script into a
        # fresh /tmp directory with its own node_modules. NODE_PATH does
        # not work with ES modules — only a local node_modules sibling to
        # the .mjs file is honoured by Node's ESM resolver.
        run: |
          if [ ! -f scripts/rag-ingest/generate-embeddings.mjs ]; then
            echo "::error::scripts/rag-ingest/generate-embeddings.mjs not found on branch '${{ inputs.branch }}'."
            echo "Make sure 'Use workflow from' AND 'Git branch to use on VPS' both point to a branch that contains this script."
            exit 1
          fi
          mkdir -p /tmp/embed-run
          cp scripts/rag-ingest/generate-embeddings.mjs /tmp/embed-run/
          cd /tmp/embed-run
          npm init -y >/dev/null
          npm install --no-audit --no-fund @supabase/supabase-js openai
          echo "✅ Script + dependencies prepared at /tmp/embed-run"

      - name: '[embed-runner] Run embeddings generation'
        if: inputs.mode == 'embed-runner'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: /tmp/embed-run
        run: |
          echo "🧮 Starting embedding generation on GitHub-hosted runner"
          echo "   (typical: 60-90 min, ~\$0.34 OpenAI cost)"
          echo ""
          node generate-embeddings.mjs

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🧠 RAG Operation Result"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Source | \`${{ inputs.source || '(n/a)' }}\` |"
            echo "| Resume | ${{ inputs.resume }} |"
            echo "| Status | ${{ job.status }} |"
            echo "| VPS | \`${{ secrets.SSH_HOST }}\` |"
            echo ""
            echo "**Verification SQL** (run in Supabase SQL editor):"
            echo '```sql'
            echo "SELECT count(DISTINCT guideline_code) AS guidelines, count(*) AS chunks"
            echo "FROM medical_guidelines;"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
