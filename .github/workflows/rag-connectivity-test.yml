name: 🔌 RAG — Connectivity Test (free, no DB writes)

# ═══════════════════════════════════════════════════════════════════════════
# Verifies that the RAG infrastructure is reachable WITHOUT writing anything:
#   1. All 16 source RSS feeds respond
#   2. Supabase is reachable (if SUPABASE_URL secret is set)
#   3. OpenAI API is reachable (if OPENAI_API_KEY secret is set)
#
# Run this BEFORE rag-ingest.yml to confirm everything is wired up.
# Cost: $0
# ═══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Connectivity check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # ─── Test 1: Source RSS feeds ──────────────────────────────────────────
      - name: Test source feed reachability
        run: npm run rag:test
        continue-on-error: true

      # ─── Test 2: Supabase reachable ───────────────────────────────────────
      - name: Test Supabase reachability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "═══ Supabase REST endpoint ═══"
          if [ -z "$SUPABASE_URL" ]; then
            echo "⏭ Skipped — no SUPABASE_URL secret configured"
            echo "   Configure at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/" \
            --max-time 10)
          if [ "$status" = "200" ] || [ "$status" = "404" ]; then
            echo "✅ Supabase reachable (HTTP $status)"
          else
            echo "❌ Supabase unreachable (HTTP $status)"
            exit 1
          fi

          echo ""
          echo "═══ medical_guidelines table check ═══"
          table_check=$(curl -sS -w "\n%{http_code}" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/medical_guidelines?select=id&limit=1" \
            --max-time 10)
          tail_status=$(echo "$table_check" | tail -1)
          if [ "$tail_status" = "200" ]; then
            echo "✅ medical_guidelines table exists"
          elif [ "$tail_status" = "404" ] || [ "$tail_status" = "400" ]; then
            echo "ℹ️  medical_guidelines table not yet created — run rag-ingest.yml in 'migrate-only' mode"
          else
            echo "⚠️  Unexpected status: $tail_status"
          fi

      # ─── Test 3: OpenAI reachable ─────────────────────────────────────────
      - name: Test OpenAI API reachability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "═══ OpenAI API ═══"
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "⏭ Skipped — no OPENAI_API_KEY secret configured"
            exit 0
          fi
          status=$(curl -sS -o /tmp/oai.json -w "%{http_code}" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            "https://api.openai.com/v1/models" \
            --max-time 15)
          if [ "$status" = "200" ]; then
            n_models=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/oai.json')).data.length)")
            echo "✅ OpenAI API reachable ($n_models models available)"
            grep -o '"id":"text-embedding-3-small"' /tmp/oai.json && \
              echo "✅ text-embedding-3-small model accessible" || \
              echo "⚠️  text-embedding-3-small not in your account"
          else
            echo "❌ OpenAI API unreachable (HTTP $status)"
            cat /tmp/oai.json
            exit 1
          fi

      # ─── Inventory ─────────────────────────────────────────────────────────
      - name: Catalog inventory
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "📚 RAG CATALOG INVENTORY (in repo)"
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "Catalogs (CSV):"
          for f in tibok-rag-collector/guidelines*.csv; do
            n=$(($(wc -l < "$f") - 1))
            echo "  $(basename $f): $n entries"
          done
          echo ""
          echo "Extracted (JSON, ready to ingest):"
          n_files=$(ls tibok-rag-collector/extracted/*.json | grep -v _summary | wc -l)
          echo "  Source files: $n_files"
          n_total=$(node -e "
            const fs = require('fs');
            let total = 0;
            for (const f of fs.readdirSync('tibok-rag-collector/extracted')) {
              if (!f.endsWith('.json') || f === '_summary.json') continue;
              const d = JSON.parse(fs.readFileSync('tibok-rag-collector/extracted/' + f));
              total += (d.documents || []).length;
            }
            console.log(total);
          ")
          echo "  Documents: $n_total"

      - name: Job summary
        if: always()
        env:
          HAS_SB:  ${{ secrets.SUPABASE_URL != '' }}
          HAS_OAI: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          {
            echo "## 🔌 Connectivity Test Result"
            echo ""
            echo "Status: ${{ job.status }}"
            echo ""
            echo "**Tests performed:**"
            echo "- ✅ Source RSS feeds (16 sources)"
            if [ "$HAS_SB" = "true" ]; then
              echo "- ✅ Supabase reachable"
            else
              echo "- ⏭ Skipped (no SUPABASE_URL secret)"
            fi
            if [ "$HAS_OAI" = "true" ]; then
              echo "- ✅ OpenAI API reachable"
            else
              echo "- ⏭ Skipped (no OPENAI_API_KEY secret)"
            fi
            echo ""
            echo "If all green, run **rag-ingest.yml** to actually push data to Supabase."
          } >> $GITHUB_STEP_SUMMARY
